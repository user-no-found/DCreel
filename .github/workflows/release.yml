name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: npm ci

      - name: Test native runtime package checks
        run: npm run test:native-runtime

      - name: Test Windows Shell and desktop host
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml -p creel-desktop-host --bin creel-desktop-host

      - name: Test Windows shortcut recycling
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml -p creel-shell-operations

      - name: Test notification action and dismissal guards
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml -p dcreel --lib --features tauri/custom-protocol desktop_notifications

      - name: Read release notes from tag
        id: release_notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 强制 UTF-8，避免非 UTF-8 控制台将中文标签正文误解码为乱码。
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # checkout 在 tag 事件下可能只建轻量标签，导致 %(contents) 为空并回退成 commit message；
          # 这里强制抓取带注释标签对象，保证读到标签正文作为更新详情。
          git fetch --force origin "refs/tags/${env:RELEASE_TAG}:refs/tags/${env:RELEASE_TAG}"
          $notes = git for-each-ref "refs/tags/${env:RELEASE_TAG}" --format="%(contents)"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = git log -1 --pretty=format:%B
          }
          $delimiter = "DCREEL_RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: tauri-apps/tauri-action@v1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DCreel ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
