[package]
name = "dcreel"
version = "0.1.1"
description = "DCreel - a calm, local-first desktop organizer"
authors = ["DCreel contributors"]
edition = "2024"
license = "Apache-2.0"

[workspace]
members = [
  ".",
  "crates/creel-logging",
  "crates/creel-ipc",
  "crates/creel-shell",
  "crates/creel-desktop-host",
]
resolver = "2"

[lib]
name = "dcreel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
creel-ipc = { path = "crates/creel-ipc" }
creel-logging = { path = "crates/creel-logging" }
dirs = "6.0.0"
log = "0.4.34"
opener = "0.8.5"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"
thiserror = "2.0.20"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
