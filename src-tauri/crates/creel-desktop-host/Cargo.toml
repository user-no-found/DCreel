[package]
name = "creel-desktop-host"
version = "0.1.2"
description = "Out-of-process native Windows desktop renderer for DCreel"
edition = "2024"
license = "Apache-2.0"

[dependencies]
creel-ipc = { path = "../creel-ipc" }
creel-logging = { path = "../creel-logging" }
dirs = "6.0.0"
log = "0.4.34"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
